<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Panel</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><div class="max-w-5xl mx-auto p-6"><h1 class="text-2xl font-bold">Admin Panel</h1><div class="grid md:grid-cols-3 gap-4 mt-4"><div class="bg-slate-900 border border-slate-800 rounded p-4"><p>Total Users</p><p id="users" class="text-3xl">0</p></div><div class="bg-slate-900 border border-slate-800 rounded p-4"><p>Total Links</p><p id="links" class="text-3xl">0</p></div><div class="bg-slate-900 border border-slate-800 rounded p-4"><p>Total Clicks</p><p id="clicks" class="text-3xl">0</p></div></div><div class="bg-slate-900 border border-slate-800 rounded p-4 mt-6"><h2 class="text-xl font-semibold">Top Performing Links</h2><div id="topLinks" class="mt-3 space-y-2"></div></div></div><script src="script.js"></script></body></html>
