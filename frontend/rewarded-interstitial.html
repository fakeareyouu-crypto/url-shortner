<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monetag Rewarded Interstitial</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">
  <main class="w-full max-w-xl rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
    <h1 class="text-2xl font-bold mb-3">Rewarded Interstitial Demo</h1>
    <p class="text-slate-300 mb-6">Click the button below to trigger Monetag rewarded interstitial ad.</p>
    <button id="showAdBtn" class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold hover:bg-indigo-500 transition">Show Rewarded Interstitial</button>
    <p id="status" class="mt-4 text-sm text-slate-400">Waiting for user action...</p>
  </main>

  <!-- Monetag SDK -->
  <script src='//libtl.com/sdk.js' data-zone='10717096' data-sdk='show_10717096'></script>

  <script>
    const statusEl = document.getElementById('status');
    const showAdBtn = document.getElementById('showAdBtn');

    showAdBtn.addEventListener('click', () => {
      statusEl.textContent = 'Opening ad...';

      // Rewarded interstitial
      show_10717096().then(() => {
        // You need to add your user reward function here, which will be executed after the user watches the ad.
        // For more details, please refer to the detailed instructions.
        alert('You have seen an ad!');
        statusEl.textContent = 'Ad completed successfully.';
      }).catch(() => {
        statusEl.textContent = 'Ad failed to load or was interrupted.';
      });
    });
  </script>
</body>
</html>
